apply plugin: 'com.android.library'


dependencies {
    implementation(name: 'unity-classes', ext:'jar')
    implementation(name: 'arcore_client', ext:'aar')
    implementation(name: 'com.mapbox.android.unity-debug', ext:'aar')
    implementation(name: 'UnityARCore', ext:'aar')
    implementation(name: 'ARPresto', ext:'aar')
    implementation(name: 'libcore-release', ext:'aar')
    implementation(name: 'unityandroidpermissions', ext:'aar')
    implementation(name: 'libtelemetry-full-release', ext:'aar')
    implementation project('xrmanifest.androidlib')

}

android {
    namespace "com.unity3d.player"
    ndkPath "/home/yazar/Unity/2022.3.62f1/Editor/Data/PlaybackEngines/AndroidPlayer/NDK"
    ndkVersion "23.1.7779620"
    compileSdkVersion 35
    buildToolsVersion '34.0.0'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    defaultConfig {
        minSdkVersion 24
        targetSdkVersion 35
        ndk {
            abiFilters 'armeabi-v7a'
        }
        versionCode 1
        versionName '2.0.0'
        consumerProguardFiles 'proguard-unity.txt'
    }

    lintOptions {
        abortOnError false
    }

    aaptOptions {
        noCompress = ['.unity3d', '.ress', '.resource', '.obb', '.bundle', '.unityexp']
        ignoreAssetsPattern = "!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~"
    }

    packagingOptions {
        exclude '/lib/armeabi/**'
        exclude '/lib/mips/**'
        exclude '/lib/mips64/**'
        exclude '/lib/x86/**'
        exclude '/lib/x86_64/**'
        doNotStrip '*/armeabi-v7a/*.so'
        jniLibs {
            useLegacyPackaging true
        }
    }
}



